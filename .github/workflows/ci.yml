name: ci
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  capsule:
    name: capsule (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - run: python tools/project.py check
      - run: python tools/check_commit_credits.py
      - run: python -m unittest discover -s tests
      - run: python tools/project.py release --output dist/homometric-photon-counts-source.zip
  arb:
    name: arb
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - run: python -m pip install --require-hashes -r requirements-replay.txt
      - run: python tools/project.py replay --output build/arb-ci
      - run: python tools/optical_study.py replay --output build/optical-ci
  ci:
    name: ci
    needs: [capsule, arb]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require all checks
        env:
          CAPSULE_RESULT: ${{ needs.capsule.result }}
          ARB_RESULT: ${{ needs.arb.result }}
        run: test "$CAPSULE_RESULT" = success && test "$ARB_RESULT" = success
